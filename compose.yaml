services:
  juice-shop:
    image: bkimminich/juice-shop:v20.3.0
    ports: ["127.0.0.1:3000:3000"]
  zap:
    image: zaproxy/zap-stable:2.17.0
    ports: ["127.0.0.1:8090:8080"]
    command: ["zap.sh", "-daemon", "-host", "0.0.0.0", "-port", "8080", "-config", "api.disablekey=true", "-config", "api.addrs.addr.name=.*", "-config", "api.addrs.addr.regex=true", "-config", "connection.timeoutInSecs=20"]
